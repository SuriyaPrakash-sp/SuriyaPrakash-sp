<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="140" y1="90" x2="1060" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4" stop-opacity=".8"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity=".25"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label{font:600 15px 'JetBrains Mono',monospace;letter-spacing:1px;fill:#E5E7EB}.small{font:13px 'JetBrains Mono',monospace;fill:#94A3B8}.node{fill:#111827;stroke:#334155;stroke-width:1.5}.pulse{animation:pulse 2.8s ease-in-out infinite}.dash{stroke-dasharray:8 12;animation:flow 3s linear infinite}@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1;filter:url(#glow)}}@keyframes flow{to{stroke-dashoffset:-40}}
    </style>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <path d="M40 72H1160M40 348H1160" stroke="#1E293B"/>
