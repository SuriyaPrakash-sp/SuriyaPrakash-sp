  <path d="M430 110V155M770 265V310" stroke="url(#line)" stroke-width="2" class="dash"/>
  <g class="pulse"><circle cx="150" cy="190" r="60" fill="#0F292B" stroke="#5EEAD4" stroke-width="2"/><text x="118" y="188" class="label">IDEAS</text><text x="105" y="212" class="small">curiosity</text></g>
  <g class="pulse" style="animation-delay:.4s"><rect x="350" y="140" width="170" height="100" rx="16" class="node"/><text x="390" y="180" class="label">BUILD</text><text x="378" y="207" class="small">Python · JS</text></g>
  <g class="pulse" style="animation-delay:.8s"><rect x="680" y="140" width="170" height="100" rx="16" class="node"/><text x="706" y="180" class="label">AUTOMATE</text><text x="710" y="207" class="small">systems · AI</text></g>
  <g class="pulse" style="animation-delay:1.2s"><circle cx="1050" cy="190" r="60" fill="#101E37" stroke="#60A5FA" stroke-width="2"/><text x="1014" y="188" class="label">SHIP</text><text x="1000" y="212" class="small">iterate</text></g>
  <g class="pulse" style="animation-delay:1.6s"><rect x="350" y="310" width="170" height="62" rx="14" class="node"/><text x="383" y="347" class="small">learn → test → improve</text></g>
  <g class="pulse" style="animation-delay:2s"><rect x="680" y="48" width="170" height="62" rx="14" class="node"/><text x="714" y="85" class="small">human-first tech</text></g>
  <circle cx="210" cy="190" r="4" fill="#5EEAD4"/><circle cx="350" cy="190" r="4" fill="#5EEAD4"/><circle cx="520" cy="190" r="4" fill="#60A5FA"/><circle cx="680" cy="190" r="4" fill="#60A5FA"/><circle cx="850" cy="190" r="4" fill="#60A5FA"/><circle cx="990" cy="190" r="4" fill="#60A5FA"/>
